services:
  # Backend API
  api:
    build: ./backend
    command: npm run dev
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  # BullMQ Worker
  worker:
    build: ./backend
    command: npm run worker
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped
    stop_grace_period: 2m

  # Frontend
  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped